<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 손금 도사</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; background-image: radial-gradient(#e2e8f0 1px, transparent 1px); background-size: 20px 20px; }
        .gradient-text { background: linear-gradient(to right, #2563eb, #ec4899); -webkit-background-clip: text; color: transparent; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen text-gray-800">

    <div class="max-w-4xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 gradient-text tracking-tight">당신의 미래, 손 안에 있습니다</h1>
            <p class="text-gray-600 text-lg mb-6">최첨단 AI 기술로 당신의 생명선, 두뇌선, 감정선과 길흉화복을 분석합니다.</p>
            
            <div id="upload-section" class="inline-block relative">
                <input type="file" id="file-input" accept="image/*" class="hidden">
                <label for="file-input" class="cursor-pointer bg-white text-gray-700 font-medium py-3 px-6 rounded-full shadow-md hover:shadow-lg transition-all border border-gray-200 flex items-center justify-center gap-2">
                    <i class="ph-fill ph-camera text-xl"></i>
                    밝은 곳에서 손바닥 전체가 잘 나오게 찍어주세요.
                </label>
            </div>
        </div>

        <div id="loading-section" class="hidden text-center py-12">
            <div class="loader mb-4"></div>
            <p class="text-lg font-bold text-blue-600 animate-pulse">AI가 열심히 길흉화복을 들여다보고 있습니다...</p>
        </div>

        <div id="result-section" class="hidden">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold flex items-center justify-center gap-2">
                    <i class="ph-fill ph-magic-wand text-purple-500"></i> 분석 결과
                </h2>
            </div>

            <!-- 3대 선 분석 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white rounded-2xl p-6 shadow-sm border-2 border-green-200">
                    <div class="flex items-center gap-2 mb-4">
                        <div class="bg-green-100 p-2 rounded-full text-green-600"><i class="ph-fill ph-heartbeat text-xl"></i></div>
                        <h3 class="text-xl font-bold text-gray-800">생명선 (건강)</h3>
                    </div>
                    <p id="result-life" class="text-gray-600 leading-relaxed"></p>
                </div>
                <div class="bg-white rounded-2xl p-6 shadow-sm border-2 border-blue-200">
                    <div class="flex items-center gap-2 mb-4">
                        <div class="bg-blue-100 p-2 rounded-full text-blue-600"><i class="ph-fill ph-brain text-xl"></i></div>
                        <h3 class="text-xl font-bold text-gray-800">두뇌선 (지능)</h3>
                    </div>
                    <p id="result-head" class="text-gray-600 leading-relaxed"></p>
                </div>
                <div class="bg-white rounded-2xl p-6 shadow-sm border-2 border-pink-200">
                    <div class="flex items-center gap-2 mb-4">
                        <div class="bg-pink-100 p-2 rounded-full text-pink-600"><i class="ph-fill ph-smiley text-xl"></i></div>
                        <h3 class="text-xl font-bold text-gray-800">감정선 (성격)</h3>
                    </div>
                    <p id="result-heart" class="text-gray-600 leading-relaxed"></p>
                </div>
            </div>

            <!-- ★ [새로 추가됨] 행운과 불행 포인트 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-blue-50 rounded-2xl p-6 shadow-sm border border-blue-200">
                    <div class="flex items-center gap-2 mb-3">
                        <i class="ph-fill ph-clover text-2xl text-blue-500"></i>
                        <h3 class="text-lg font-bold text-blue-800">타고난 행운 포인트</h3>
                    </div>
                    <p id="result-lucky" class="text-blue-900 leading-relaxed"></p>
                </div>
                
                <div class="bg-red-50 rounded-2xl p-6 shadow-sm border border-red-200">
                    <div class="flex items-center gap-2 mb-3">
                        <i class="ph-fill ph-warning-circle text-2xl text-red-500"></i>
                        <h3 class="text-lg font-bold text-red-800">조심해야 할 불행/주의</h3>
                    </div>
                    <p id="result-unlucky" class="text-red-900 leading-relaxed"></p>
                </div>
            </div>

            <!-- 종합 풀이 -->
            <div class="bg-white rounded-2xl p-8 shadow-md text-center border border-gray-100">
                <h3 class="text-xl font-bold mb-4 flex items-center justify-center gap-2">
                    <i class="ph-fill ph-star text-yellow-400"></i> 종합 사주 풀이 <i class="ph-fill ph-star text-yellow-400"></i>
                </h3>
                <p id="result-summary" class="text-gray-700 italic text-lg leading-relaxed"></p>
            </div>

            <div class="text-center mt-10">
                <button onclick="resetApp()" class="text-blue-600 font-medium hover:text-blue-800 flex items-center justify-center gap-1 mx-auto">
                    <i class="ph ph-arrow-counter-clockwise"></i> 다시 분석하기
                </button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const uploadSection = document.getElementById('upload-section');
        const loadingSection = document.getElementById('loading-section');
        const resultSection = document.getElementById('result-section');

        function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            uploadSection.classList.add('hidden');
            resultSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');

            try {
                const compressedBase64 = await compressImage(file);
                const base64Data = compressedBase64.split(',')[1]; 

                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Data })
                });

                if (!response.ok) throw new Error("서버 에러 발생");

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                showResult(data);

            } catch (error) {
                console.error(error);
                handleMockData();
            }
        });

        function showResult(data) {
            loadingSection.classList.add('hidden');
            resultSection.classList.remove('hidden');

            document.getElementById('result-life').innerText = data.lifeLine;
            document.getElementById('result-head').innerText = data.headLine;
            document.getElementById('result-heart').innerText = data.heartLine;
            document.getElementById('result-lucky').innerText = data.luckyPoint || "특정하기 어렵지만 전반적인 운름이 좋습니다.";
            document.getElementById('result-unlucky').innerText = data.unluckyPoint || "크게 주의할 점은 없으나 항상 건강을 챙기세요.";
            document.getElementById('result-summary').innerText = `"${data.summary}"`;
        }

        function handleMockData() {
            const mockData = {
                lifeLine: "생명선이 중간에 살짝 옅어지는 구간이 있어 30대 중반에 체력 저하가 올 수 있습니다.",
                headLine: "두뇌선이 매우 선명하고 길어 계산이 빠르고 이재에 밝습니다.",
                heartLine: "감정선이 여러 갈래로 나뉘어 있어 감정 기복이 심할 수 있습니다.",
                luckyPoint: "재물운을 상징하는 선이 뚜렷하여 중년 이후 뜻밖의 큰 재물을 얻을 수 있는 대길의 행운이 숨어있습니다.",
                unluckyPoint: "생명선 끝부분이 흐려지는 것으로 보아, 과로로 인한 갑작스러운 쓰러짐이나 관절 쪽 질환을 크게 조심해야 합니다.",
                summary: "초년에는 다소 굴곡이 있으나, 인내하면 중년 이후로 대운이 트이는 손금입니다. 욱하는 성질만 죽이면 큰 재물을 모을 수 있습니다."
            };
            showResult(mockData);
        }

        function resetApp() {
            fileInput.value = '';
            resultSection.classList.add('hidden');
            loadingSection.classList.add('hidden');
            uploadSection.classList.remove('hidden');
        }
    </script>
</body>
</html>
